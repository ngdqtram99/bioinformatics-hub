{% extends 'base.html' %}
{% load static %}
<html>
    {% block content %}

    <style>
      .filled{
        background-color: rgb(0, 123, 255);
      }

      .max-width-input {
      width: 100%; 
      }    
        .main_output {
          width: fit-content;
          background-color: #f2f3f1;    
          text-align: left;
          max-width: 95%;
          max-height: 90vh;
          display: block;  
          overflow: auto;
       
        }
        table, th, td {
        text-align: center;
        width: 20px;
        height:20px;
        table-layout: fixed;
        border: 1px solid rgb(0,0,0,10%);       
    }
    .calculation th:first-child,
      .calculation td:first-child {
        position: sticky;
        left: 0;
        z-index: 0;
        background-color: #f2f3f1;
       
      }
      thead {
        font-weight: normal;
        position: sticky;
        top: 0;
        z-index: 1;
        background-color: #f2f3f1;
      }
      table {
        font-weight: bold;
        border-collapse: inherit;
        border-spacing: 0px;
        
      }
    </style>
    <body>
        <h1>Überlapp Alignment</h1>
        <p>
          Beschreibung
        </p>
        <form method="POST" action="{% url 'overlap' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Suchen</button>
        </form>
      {% if matrix is not None %} 
      
        <table id="matrixTable"> </table>
        <br>
        <div id="alignmentsContainer"> </div>
          
      <script> 
        var matrixValues = {{matrix}}
        var alignments = {{alignments|safe}}
        var firstSequence = '{{form.sequence1.value}}'.split("")
        firstSequence.unshift(""); 
        firstSequence.unshift("");
        var secondSequence = '{{form.sequence2.value}}'.split("")
        secondSequence.unshift(""); 
        secondSequence.unshift("M");
    </script>
      <script src="{% static 'js/pairwise.js' %}"></script>  
      
      {% endif %}
    </body>

    {% endblock %}

</html>
