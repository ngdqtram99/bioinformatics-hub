{% load static %}
<!DOCTYPE html>
<html>
<style>
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  padding: 10px;
  background-color: #f2f2f2;
  display: flex; /* Use flexbox to align items horizontally */
  align-items: center; /* Center items vertically within the footer */
}

footer a {
  text-decoration: none;
  color: #333;
  font-size: 14px;
}

.vertical-bar {
  margin: 0 5px; /* Add some space on the left and right of the vertical bar */
  font-size: 14px;
}

div.description {
    display: inline-block;
    line-height: 150%;
    vertical-align: top;
    
}

body {
    min-width: 100px;
    min-height: 1500px;
    background-color: #ffffff;
    color: #373534;
    margin: 0px;
    font-family: Arial,"Helvetica Narrow",sans-serif;
}

h1 {
    background-color: #cacac8;
    font-size: 100%;
    font-weight: bold;
    padding: 3pt 0pt 3pt 12pt;
    padding-top: 3pt;
    padding-right: 0pt;
    padding-bottom: 3pt;
    padding-left: 12pt;
    
   
}

h2 {
    color: #03060a; 
    
}

button {
    font-family: Arial,"Helvetica Narrow",sans-serif;
    color: #131211;
}

div.algo {
    display: block;
    position: sticky;
    left: 200px;
    margin: 0px;
    padding: 30px;
    background-color: #d4e7f3;
}



</style>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="sidebar">
        <a href="#" class="menu-item">Home</a>
        <div class="accordion">
            <button class="accordion-btn" onclick="toggleAccordion()">Alignment <i class="fa fa-caret-down"></i></button>
            <div class="accordion-content">
                <a href="/needleman_wunsch" class="menu-item">Needleman-Wunsch</a>
                <a href="/smith_waterman" class="menu-item">Smith-Waterman</a>
                <a href="/glocal_alignment" class="menu-item">Glokales Alignment</a>
                <a href="/overlap" class="menu-item">Überlapp-Alignment</a>
            </div>
        </div>
        <a href="/dotplot" class="menu-item">Dotplot</a>
        <div class="accordion">
            <button class="accordion-btn" onclick="toggleAccordion()">Exaktes Pattternmatching <i class="fa fa-caret-down"></i></button>
            <div class="accordion-content">
                <a href="/simple_search" class="menu-item">Simple Search</a>
                <a href="/horspool" class="menu-item">Horspool</a>
            </div>
        </div>
        <div class="accordion">
            <button class="accordion-btn" onclick="toggleAccordion()">Phylogenie <i class="fa fa-caret-down"></i></button>
            <div class="accordion-content">
                <a href="/upgma" class="menu-item">UPGMA</a>
                <a href="/neighbour_joining" class="menu-item">Neighbour Joining</a>
            </div>
        </div>        
        <div class="accordion">
            <button class="accordion-btn" onclick="toggleAccordion()">String Indizes <i class="fa fa-caret-down"></i></button>
            <div class="accordion-content">
                <a href="/suffix_trie" class="menu-item">Suffixtrie</a>
                <a href="/suffix_tree" class="menu-item">Suffixtree</a>
                <a href="/suffix_array" class="menu-item">Suffixarray</a>
            </div>
        </div>
        <a href="#" class="menu-item">Viterbi</a>
        <footer>
            <a href="https://www.thm.de/site/datenschutz.html">Datenschutz</a>
            <span class="vertical-bar"> | </span>
            <a href="https://www.thm.de/site/impressum.html">Impressum</a>
        </footer>
        
        
    </div>

    <div class="content">
        {% block content %}
        
        {% endblock %}

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var accordionBtns = document.getElementsByClassName("accordion-btn");
          
            for (var i = 0; i < accordionBtns.length; i++) {
              accordionBtns[i].addEventListener("click", toggleAccordion);
            }
          });
          
          function toggleAccordion() {
            var accordionContent = this.nextElementSibling;
            var accordionBtn = this;
          
            $(accordionContent).slideToggle();
            $(accordionBtn).toggleClass("active");
          }
    </script>
</body>
</html>
