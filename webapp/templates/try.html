<!DOCTYPE html>
<html>
<head>
<style>
   .accordion {
    border: 1px solid #ccc;
    border-radius: 5px;
}

.accordion-item {
    border-bottom: 1px solid #ccc;
}

.accordion-header {
    background-color: #f0f0f0;
    padding: 10px;
    width: 100%;
    text-align: left;
    cursor: pointer;
}

.accordion-content {
    display: none;
    padding: 10px;
}

</style>
<script>
  <div class="accordion">
    <div class="accordion-item">
        <button class="accordion-header">Section 1</button>
        <div class="accordion-content">
            Content for Section 1.
        </div>
    </div>
    <div class="accordion-item">
        <button class="accordion-header">Section 2</button>
        <div class="accordion-content">
            Content for Section 2.
        </div>
    </div>
    <!-- ... More accordion items ... -->
</div>

</script>
</head>
<body>

<button class="accordion-btn" onclick="toggleAccordion()">Toggle Content</button>
<div id="accordion-content" style="display: none;">
    This is the content of the accordion section.
</div>

</body>
</html>
